services:
  - type: web
    name: orbit-demo-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/orbit/requirements.txt
    startCommand: uvicorn backend.orbit.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ORBIT_PUBLIC_DEMO
        value: 'true'
      - key: FALKORDB_GRAPH
        value: orbit_public_demo
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        value: falkordb
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        sync: false
      - key: ORBIT_ALLOWED_HOSTS
        sync: false
      - key: ORBIT_ALLOWED_ORIGINS
        sync: false
